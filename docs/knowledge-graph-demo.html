<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>知源 · 知识图谱</title>
<style>
body{font-family:-apple-system,sans-serif;background:#F9F6F0;color:#1A1512;max-width:460px;margin:0 auto;min-height:100vh;padding:24px 20px}
h2{font-family:Georgia,serif;font-size:24px;margin:0 0 4px}
.sub{font-size:13px;color:#8A7E70;margin:0 0 16px}
.legend{display:flex;gap:14px;margin-bottom:12px;flex-wrap:wrap}
.leg{display:flex;align-items:center;gap:4px;font-size:11px;color:#8A7E70}
.leg b{width:8px;height:8px;border-radius:50%;display:inline-block}
#canvas-wrap{background:#F3EEE4;border-radius:12px;border:1px solid #E8E1D4;padding:10px;margin-bottom:16px}
canvas{display:block;width:100%;border-radius:8px}
.info{background:#fff;border-radius:10px;border:1px solid #E8E1D4;padding:14px;display:none}
.info.on{display:block}
.info h3{font-family:Georgia,serif;font-size:16px;margin:0 0 2px}
.info .type{font-size:10px;color:#8A7E70;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.info p{font-size:13px;color:#5A5045;line-height:1.6;margin:0 0 10px}
.info .tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.info .tags span{font-size:10px;padding:2px 8px;background:#F3EEE4;border-radius:4px;color:#5A5045}
.info .conn-title{font-size:12px;font-weight:600;margin-bottom:8px}
.info .conn{cursor:pointer;padding:8px 12px;background:#F3EEE4;border-radius:8px;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.info .conn:hover{background:#EBE4D6}
.conn .dot{width:6px;height:6px;border-radius:50%;background:#C0774E}
.conn .dot.concept{background:#3A5A45}
.conn .dot.domain{background:#C49B5A}
.conn .label{font-size:12px;font-weight:500}
.conn .sub{font-size:10px;color:#8A7E70;margin-left:auto}
</style></head><body>
<h2>知识图谱</h2>
<p class="sub">可视化笔记、概念与领域关联 · 点击节点查看详情</p>
<div class="legend">
<div class="leg"><b style="background:#C0774E"></b>笔记</div><div class="leg"><b style="background:#3A5A45"></b>概念</div><div class="leg"><b style="background:#C49B5A"></b>领域</div><span class="leg" id="clear" style="display:none;cursor:pointer;color:#C0774E;margin-left:auto" onclick="selected=null;draw()">清除选中</span>
</div>
<div id="canvas-wrap"><canvas id="c" width="800" height="600"></canvas></div>
<div class="info" id="info"></div>
<script>
var nodes=[
  {id:"n1",type:"note",label:"Building Effective Agents",desc:"Agent构建权威指南",tags:["Agent","LLM"],cx:280,cy:180},
  {id:"n2",type:"note",label:"AI 编程最佳实践",desc:"五层次编程方法论",tags:["AI","编程"],cx:360,cy:280},
  {id:"n3",type:"note",label:"系统设计面试",desc:"分布式系统设计指南",tags:["系统设计"],cx:200,cy:320},
  {id:"n4",type:"note",label:"Transformer 解析",desc:"自注意力机制详解",tags:["深度学习"],cx:120,cy:220},
  {id:"c1",type:"concept",label:"Agent",desc:"自主决策AI系统",tags:["AI"],cx:320,cy:130},
  {id:"c2",type:"concept",label:"Tool Use",desc:"LLM调用外部工具",tags:["AI"],cx:400,cy:200},
  {id:"c3",type:"concept",label:"Prompt Engineering",desc:"提示词工程方法",tags:["AI","编程"],cx:440,cy:310},
  {id:"c4",type:"concept",label:"Workflow",desc:"多步骤任务编排",tags:["系统设计"],cx:280,cy:390},
  {id:"c5",type:"concept",label:"Attention",desc:"自注意力机制",tags:["深度学习"],cx:60,cy:160},
  {id:"c6",type:"concept",label:"CAP 定理",desc:"一致性/可用性/分区",tags:["系统设计"],cx:140,cy:400},
  {id:"d1",type:"domain",label:"AI & ML",desc:"人工智能与机器学习",cx:400,cy:80},
  {id:"d2",type:"domain",label:"系统设计",desc:"分布式架构",cx:80,cy:440},
];
var edges=[
  ["n1","c1"],["n1","c2"],["n1","c4"],["n1","d1"],
  ["n2","c3"],["n2","c1"],["n2","d1"],
  ["n3","c6"],["n3","c4"],["n3","d2"],
  ["n4","c5"],["n4","d1"],
  ["c1","c2"],["c1","c4"],["c5","d1"],["c6","d2"],
];
var selected=null;

function colors(t){
  if(t==="note")return {fill:"#C0774E",stroke:"#C0774E"};
  if(t==="concept")return {fill:"#3A5A45",stroke:"#3A5A45"};
  return {fill:"#C49B5A",stroke:"#C49B5A"};
}

var sizes={note:16,concept:11,domain:20};

function draw(){
  var c=document.getElementById("c"),w=c.width/2,h=c.height/2;
  var ctx=c.getContext("2d");
  // 设备像素比适配
  var dpr=window.devicePixelRatio||1;
  c.width=800*dpr;c.height=600*dpr;c.style.width="100%";c.style.height="380px";
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,800,600);

  // 画边
  edges.forEach(function(e){
    var a=nodes.find(function(n){return n.id===e[0]});
    var b=nodes.find(function(n){return n.id===e[1]});
    if(!a||!b)return;
    var hl=selected&&(e[0]===selected||e[1]===selected);
    ctx.beginPath();ctx.moveTo(a.cx,a.cy);ctx.lineTo(b.cx,b.cy);
    ctx.strokeStyle=hl?"#C0774E":"rgba(140,130,115,0.18)";
    ctx.lineWidth=hl?2.5:1;
    ctx.stroke();
  });

  // 画节点
  nodes.forEach(function(n){
    var col=colors(n.type);var r=sizes[n.type];
    var active=n.id===selected;
    var highlight=!selected||active||edges.some(function(e){return active&&(e[0]===n.id||e[1]===n.id)});
    ctx.beginPath();ctx.arc(n.cx,n.cy,r,0,Math.PI*2);
    ctx.fillStyle=active?"#C0774E":highlight?col.fill:"rgba(140,130,115,0.2)";
    ctx.fill();
    ctx.strokeStyle=col.stroke;ctx.lineWidth=2;ctx.stroke();
    
    // 标签
    if(r>12){
      ctx.fillStyle="#fff";ctx.font="bold 12px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.fillText(n.label.charAt(0),n.cx,n.cy);
    }
    // 名称
    if(r>12||n.type==="domain"||active){
      ctx.fillStyle="#5A5045";ctx.font="10px sans-serif";
      var txt=n.label.length>8?n.label.slice(0,7)+"…":n.label;
      ctx.fillText(txt,n.cx,n.cy+r+10);
    }
  });

  // 信息面板
  var info=document.getElementById("info");
  info.innerHTML="";info.className="info";
  document.getElementById("clear").style.display=selected?"inline":"none";
  if(selected){
    info.className="info on";
    var sel=nodes.find(function(n){return n.id===selected});
    if(!sel)return;
    var h='<div class="type">'+sel.type.toUpperCase()+'</div><h3>'+sel.label+'</h3><p>'+sel.desc+'</p>';
    if(sel.tags)h+='<div class="tags">'+sel.tags.map(function(t){return'<span>#'+t+'</span>'}).join("")+'</div>';
    var conns=[];
    edges.forEach(function(e){
      if(e[0]===selected)conns.push(e[1]);
      if(e[1]===selected)conns.push(e[0]);
    });
    conns=[...new Set(conns)];
    if(conns.length){
      h+='<div class="conn-title">关联节点 · '+conns.length+'</div>';
      conns.forEach(function(cid){
        var cn=nodes.find(function(n){return n.id===cid});
        if(!cn)return;
        h+='<div class="conn" onclick="selected=\''+cid+'\';draw()"><div class="dot '+cn.type+'"></div><div class="label">'+cn.label+'</div><div class="sub">'+cn.type+'</div></div>';
      });
    }
    info.innerHTML=h;
  }
}

document.getElementById("c").addEventListener("click",function(e){
  var rect=e.target.getBoundingClientRect();
  var scaleX=400/rect.width,scaleY=300/(rect.height||380);
  var mx=(e.clientX-rect.left)*scaleX,my=(e.clientY-rect.top)*scaleY;
  var best=null,bestD=24;
  nodes.forEach(function(n){
    var dx=mx-n.cx,dy=my-n.cy,d=Math.sqrt(dx*dx+dy*dy);
    if(d<bestD){best=n.id;bestD=d;}
  });
  selected=selected===best?null:best;
  draw();
});

draw();
</script></body></html>
