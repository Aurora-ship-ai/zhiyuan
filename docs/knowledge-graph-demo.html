<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>知源 · 知识图谱</title>
<style>
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#EDE8DE;display:flex;justify-content:center;min-height:100vh;margin:0;overflow:hidden;-webkit-font-smoothing:antialiased}
.page{width:100%;max-width:460px;background:#F9F6F0;min-height:100vh;display:flex;flex-direction:column;position:relative}
.top{padding:20px 20px 0;z-index:2}
.top h2{font-family:Georgia,serif;font-size:22px;margin:0 0 2px;color:#1A1512}
.top .sub{font-size:12px;color:#8A7E70}
.legend{display:flex;gap:16px;margin-top:8px;z-index:2}
.leg{display:flex;align-items:center;gap:5px;font-size:11px;color:#8A7E70}
.leg b{width:9px;height:9px;border-radius:50%}
#graph{flex:1;position:relative;overflow:hidden;cursor:grab;border-top:1px solid #E8E1D4}
#graph:active{cursor:grabbing}
#graph.dragging{cursor:grabbing}
canvas{position:absolute;top:0;left:0}
.tooltip{position:absolute;pointer-events:none;background:#fff;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:600;color:#1A1512;box-shadow:0 2px 12px rgba(0,0,0,.08);opacity:0;transition:opacity .15s;z-index:5;white-space:nowrap;font-family:Georgia,serif}
.tooltip.on{opacity:1}
.bottom{background:rgba(249,246,240,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:14px 20px 20px;border-top:1px solid #E8E1D4;z-index:2;display:none}
.bottom.on{display:block}
.bottom h3{font-family:Georgia,serif;font-size:16px;margin:0 0 2px;color:#1A1512}
.bottom .type{font-size:10px;color:#8A7E70;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.bottom p{font-size:13px;color:#5A5045;margin:0 0 8px;line-height:1.6}
.bottom .tags{display:flex;gap:4px;flex-wrap:wrap}
.bottom .tags span{font-size:10px;padding:3px 8px;background:#F3EEE4;border-radius:4px;color:#5A5045}
</style></head><body><div class="page">
<div class="top"><h2>知识图谱</h2><p class="sub">拖拽节点 · 滚轮缩放 · 点击查看详情</p>
<div class="legend"><div class="leg"><b style="background:#C0774E"></b>笔记</div><div class="leg"><b style="background:#3A5A45"></b>概念</div><div class="leg"><b style="background:#C49B5A"></b>领域</div></div></div>
<div id="graph"><canvas id="c"></canvas><div class="tooltip" id="tip"></div></div>
<div class="bottom" id="btm"></div></div>
<script>
(function(){
var NODES=[
  {id:"n1",t:"note",l:"Building Effective Agents",d:"Anthropic Agent构建权威指南",tags:["Agent","LLM"]},
  {id:"n2",t:"note",l:"AI 编程最佳实践",d:"五层次编程方法论",tags:["AI","编程"]},
  {id:"n3",t:"note",l:"系统设计面试指南",d:"分布式系统设计方法论",tags:["系统设计"]},
  {id:"n4",t:"note",l:"Transformer 架构解析",d:"自注意力机制详解",tags:["深度学习","NLP"]},
  {id:"c1",t:"concept",l:"Agent",d:"自主决策AI系统",tags:["AI"]},
  {id:"c2",t:"concept",l:"Tool Use",d:"LLM调用外部工具",tags:["AI"]},
  {id:"c3",t:"concept",l:"Prompt Engineering",d:"提示词优化工程",tags:["AI","编程"]},
  {id:"c4",t:"concept",l:"Workflow",d:"多步骤任务编排",tags:["系统设计"]},
  {id:"c5",t:"concept",l:"Attention",d:"自注意力机制",tags:["深度学习"]},
  {id:"c6",t:"concept",l:"CAP 定理",d:"一致性可用性分区",tags:["系统设计"]},
  {id:"d1",t:"domain",l:"AI & ML",d:"人工智能与机器学习领域",tags:[]},
  {id:"d2",t:"domain",l:"系统设计",d:"分布式系统与架构领域",tags:[]},
];
var EDGES=[["n1","c1"],["n1","c2"],["n1","c4"],["n1","d1"],["n2","c3"],["n2","c1"],["n2","d1"],["n3","c6"],["n3","c4"],["n3","d2"],["n4","c5"],["n4","d1"],["c1","c2"],["c1","c4"]];
var SIZE={note:18,concept:12,domain:24};
var COLOR={note:"#C0774E",concept:"#3A5A45",domain:"#C49B5A"};
var BGLIGHT={note:"rgba(192,119,78,0.06)",concept:"rgba(58,90,69,0.06)",domain:"rgba(196,155,90,0.06)"};

var nodes=[],edges=[],pos=[],vel=[];
var sel=null,hover=null;
var tx=0,ty=0,zoom=1,smoothZoom=1;
var dragging=-1,panning=!1,panStart={};
var graphEl=document.getElementById("graph");
var canvas=document.getElementById("c"),ctx=c.getContext("2d");
var tip=document.getElementById("tip"),btm=document.getElementById("btm");
var W=400,H=500;

function init(){
  nodes=NODES.map(function(n){return Object.assign({},n)});
  edges=EDGES.slice();
  pos=[];vel=[];
  var cx=W/2,cy=H/2;
  nodes.forEach(function(n,i){
    var a=i/nodes.length*Math.PI*2,rx=120+(n.t==="domain"?60:n.t==="note"?30:0);
    pos[i]=[cx+Math.cos(a)*rx+Math.random()*40,cy+Math.sin(a)*(rx*.6)+Math.random()*40];
    vel[i]=[0,0];
  });
  resize();
  requestAnimationFrame(loop);
}

function resize(){
  var r=graphEl.getBoundingClientRect();
  W=r.width;H=r.height;
  var dpr=window.devicePixelRatio||1;
  canvas.width=W*dpr;canvas.height=H*dpr;
  canvas.style.width=W+"px";canvas.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}

var lastT=0;
function loop(t){
  var dt=Math.min((t-lastT)/16,3);lastT=t;
  simulate(dt);
  smoothZoom+=(zoom-smoothZoom)*0.15;
  draw();
  requestAnimationFrame(loop);
}

function simulate(dt){
  // 力导向：排斥力 + 弹簧力 + 阻力
  for(var i=0;i<nodes.length;i++){
    if(i===dragging)continue;
    var fx=0,fy=0;
    for(var j=0;j<nodes.length;j++){
      if(i===j)continue;
      var dx=pos[i][0]-pos[j][0],dy=pos[i][1]-pos[j][1];
      var d=Math.max(Math.sqrt(dx*dx+dy*dy),1);
      var s=nodes[i].t==="domain"?2e5:5e4;
      fx+=dx/d*s/(d*d);fy+=dy/d*s/(d*d);
    }
    vel[i][0]+=fx*0.002*dt;vel[i][1]+=fy*0.002*dt;
  }
  edges.forEach(function(e){
    var a=nodes.indexOf(nodes.find(function(n){return n.id===e[0]}));
    var b=nodes.indexOf(nodes.find(function(n){return n.id===e[1]}));
    if(a<0||b<0)return;
    var dx=pos[b][0]-pos[a][0],dy=pos[b][1]-pos[a][1];
    var d=Math.max(Math.sqrt(dx*dx+dy*dy),1);
    var rest=nodes[a].t==="domain"?180:100;
    var f=(d-rest)*0.02;
    if(a!==dragging){vel[a][0]+=dx/d*f*dt;vel[a][1]+=dy/d*f*dt;}
    if(b!==dragging){vel[b][0]-=dx/d*f*dt;vel[b][1]-=dy/d*f*dt;}
  });
  for(var i=0;i<nodes.length;i++){
    if(i===dragging)continue;
    vel[i][0]*=0.85;vel[i][1]*=0.85;
    pos[i][0]+=vel[i][0]*dt;pos[i][1]+=vel[i][1]*dt;
    pos[i][0]=Math.max(40,Math.min(W-40,pos[i][0]));
    pos[i][1]=Math.max(40,Math.min(H-40,pos[i][1]));
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);
  var sz=smoothZoom;
  tx=(W/2)*(1-sz)+(W/2)*sz-W/2*sz+W/2-W/2*sz;
  ty=(H/2)*(1-sz)+(H/2)*sz-H/2*sz+H/2-H/2*sz;
  ctx.save();
  ctx.translate(W/2,H/2);ctx.scale(sz,sz);ctx.translate(-W/2,-H/2);
  // 边
  edges.forEach(function(e){
    var a=nodes.findIndex(function(n){return n.id===e[0]});
    var b=nodes.findIndex(function(n){return n.id===e[1]});
    if(a<0||b<0)return;
    var hl=sel&&(e[0]===sel||e[1]===sel);
    ctx.beginPath();ctx.moveTo(pos[a][0],pos[a][1]);ctx.lineTo(pos[b][0],pos[b][1]);
    ctx.strokeStyle=hl?"rgba(192,119,78,0.5)":"rgba(140,130,115,0.13)";
    ctx.lineWidth=hl?2:1;ctx.stroke();
  });
  // 节点光晕
  nodes.forEach(function(n,i){
    if(n.id===hover||n.id===sel){
      ctx.beginPath();ctx.arc(pos[i][0],pos[i][1],SIZE[n.t]+12,0,Math.PI*2);
      ctx.fillStyle=BGLIGHT[n.t];ctx.fill();
    }
  });
  // 节点
  nodes.forEach(function(n,i){
    var sz=SIZE[n.t];var col=COLOR[n.t];
    var active=n.id===sel||n.id===hover;
    // 外发光
    if(active){
      ctx.beginPath();ctx.arc(pos[i][0],pos[i][1],sz+3,0,Math.PI*2);
      ctx.fillStyle="rgba(255,255,255,0.6)";ctx.fill();
    }
    ctx.beginPath();ctx.arc(pos[i][0],pos[i][1],sz,0,Math.PI*2);
    ctx.fillStyle=col;ctx.fill();
    ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.stroke();
    // 标签
    ctx.fillStyle=active?"#fff":col;
    ctx.font=(sz>15?"bold 10px":"8px")+" sans-serif";
    ctx.textAlign="center";ctx.textBaseline="middle";
    if(sz>14)ctx.fillText(n.l.charAt(0),pos[i][0],pos[i][1]);
    // 名称
    var alpha=n.id===sel||n.id===hover?1:0.5;
    ctx.fillStyle="rgba(90,80,69,"+alpha+")";
    ctx.font="10px sans-serif";
    var txt=n.l.length>7?n.l.slice(0,6)+"…":n.l;
    ctx.fillText(txt,pos[i][0],pos[i][1]+sz+10);
  });
  ctx.restore();
}

// 交互
graphEl.addEventListener("wheel",function(e){e.preventDefault();zoom=Math.max(.3,Math.min(2,zoom-e.deltaY*.001));});

graphEl.addEventListener("mousedown",function(e){
  var r=canvas.getBoundingClientRect();
  var mx=(e.clientX-r.left-W/2)/smoothZoom+W/2,my=(e.clientY-r.top-H/2)/smoothZoom+H/2;
  dragging=-1;
  for(var i=nodes.length-1;i>=0;i--){
    var dx=mx-pos[i][0],dy=my-pos[i][1];
    if(dx*dx+dy*dy<SIZE[nodes[i].t]*SIZE[nodes[i].t]*2){dragging=i;break;}
  }
  if(dragging<0){panning=!0;panStart={x:e.clientX,y:e.clientY};}
  graphEl.classList.toggle("dragging",dragging>=0);
});

window.addEventListener("mousemove",function(e){
  var r=canvas.getBoundingClientRect();
  var mx=(e.clientX-r.left-W/2)/smoothZoom+W/2,my=(e.clientY-r.top-H/2)/smoothZoom+H/2;
  if(dragging>=0){
    pos[dragging][0]=mx;pos[dragging][1]=my;
    vel[dragging][0]=0;vel[dragging][1]=0;
  }
  if(panning){tx+=e.clientX-panStart.x;ty+=e.clientY-panStart.y;panStart={x:e.clientX,y:e.clientY};}
  // 悬浮检测
  var nh=null;
  for(var i=nodes.length-1;i>=0;i--){
    var dx=mx-pos[i][0],dy=my-pos[i][1];
    if(dx*dx+dy*dy<SIZE[nodes[i].t]*SIZE[nodes[i].t]*2){nh=nodes[i].id;break;}
  }
  if(nh!==hover){hover=nh;if(hover){
    var hn=nodes.find(function(n){return n.id===hover});
    tip.textContent=hn.l;tip.className="tooltip on";
    tip.style.left=(e.clientX-graphEl.getBoundingClientRect().left+16)+"px";
    tip.style.top=(e.clientY-graphEl.getBoundingClientRect().top-32)+"px";
  }else{tip.className="tooltip"}}
});

window.addEventListener("mouseup",function(e){
  if(dragging>=0&&vel[dragging][0]*vel[dragging][0]+vel[dragging][1]*vel[dragging][1]<1){
    sel=sel===nodes[dragging].id?null:nodes[dragging].id;
    updateBottom();
  }
  dragging=-1;panning=!1;
  graphEl.classList.remove("dragging");
});

function updateBottom(){
  btm.className="bottom";btm.innerHTML="";
  if(!sel)return;
  btm.className="bottom on";
  var n=nodes.find(function(x){return x.id===sel});if(!n)return;
  var h='<h3>'+n.l+'</h3><div class="type">'+n.t.toUpperCase()+'</div><p>'+n.d+'</p>';
  if(n.tags&&n.tags.length)h+='<div class="tags">'+n.tags.map(function(t){return'<span>#'+t+'</span>'}).join("")+'</div>';
  btm.innerHTML=h;
}

window.addEventListener("resize",resize);
init();
})();
</script></body></html>
